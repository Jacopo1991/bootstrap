name: Bootstrap
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash ci/lint.sh
  distro:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Fresh pinned Ubuntu image, bootstrap twice, distro and boundary checks
        run: bash ci/distro.sh
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1 BasePath regression tests
        shell: powershell
        run: powershell.exe -NoProfile -File ci/windows-test.ps1
  gpu-resolution:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Resolve host and pinned-container GPU requirements without a GPU
        run: bash ci/gpu-resolution.sh
  gate:
    if: ${{ always() }}
    needs: [lint, distro, windows, gpu-resolution]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report all required results
        env:
          LINT: ${{ needs.lint.result }}
          DISTRO: ${{ needs.distro.result }}
          WINDOWS: ${{ needs.windows.result }}
          GPU_RESOLUTION: ${{ needs.gpu-resolution.result }}
        run: |
          printf 'lint=%s\ndistro=%s\nwindows=%s\ngpu-resolution=%s\n' "$LINT" "$DISTRO" "$WINDOWS" "$GPU_RESOLUTION" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$LINT" = success
          test "$DISTRO" = success
          test "$WINDOWS" = success
          test "$GPU_RESOLUTION" = success
