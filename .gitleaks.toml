[extend]
useDefault = true

# Public SHA-256 checksums for the SecretSpec archive and apt signing keys.
# Exempt only these exact checksum assignments, never a whole file or directory.
[[allowlists]]
description = "Public release and apt key checksums"
condition = "AND"
paths = ['''^home/\.chezmoitemplates/pins\.env$''']
regexTarget = "line"
regexes = ['''^(SECRETSPEC|GH_KEY|DOCKER_KEY|NVIDIA_KEY)_SHA256='[a-f0-9]{64}'$''']
