# Package version caps: the one policy file for packages that must stay at or below a
# known-good version, with an exact pin, everywhere.
#
# Enforced in two places, both reading this file:
# - the shared pre-commit gate of every repository (`package-cap-check`, next to gitleaks
#   and osv-scanner): requirements*.txt, constraints*.txt, pyproject.toml, uv.lock,
#   poetry.lock, Pipfile.lock, Dockerfiles and compose files;
# - the agent policy hook (`pre_tool_use.py`): pip/uv/pipx/poetry installs and
#   docker pull/run of the listed images.
#
# install.sh installs it root-owned as /usr/local/lib/agent-policy/package-caps.toml.
# To cap another package, add one [packages.<pypi-name>] table with the same keys.

[packages.litellm]
# Highest allowed version, inclusive. Manifests must pin exactly (==), image tags must
# carry a version at or below this; `latest`, `main-*` and untagged images are refused.
max_version = "1.106.2"
images = ["ghcr.io/berriai/litellm", "berriai/litellm"]
reason = "litellm 1.107.0 on PyPI and the v1.107.0, latest, main-latest and main-stable image tags were compromised on 2026-10-21 (credential-stealing malware with a remote code loader); 1.106.2 and earlier are safe"
source = "https://docs.litellm.ai/blog/security-incident-oct-21-2026"
added = 2026-10-23
