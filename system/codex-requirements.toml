# Root-owned Codex requirements: install.sh copies this file to /etc/codex/requirements.toml.
# Codex enforces requirements above user, project and session config; the agent account can
# neither edit nor override them. Only the guardrails live here: the policy hooks and the
# forbidden/prompt command rules and permission profiles. Approval policy and the routine Git/gh allow
# rules stay preferences in ~/.codex (no allowed_* lists, no allow_managed_hooks_only).

# Read-deny for every sandboxed tool command: credentials and private data. `--sandbox` cannot be
# combined with a permissions profile, so `task` launches Codex with `-c default_permissions="lane"`
# or `"review"`. Each profile (below) extends the built-in one that keeps its write scope and adds
# the denies. Only these two are allowed and the default is the writable one, so a lane cannot
# select a weaker profile. The deny applies to commands run in the sandbox; the `codex` process
# itself still reads ~/.codex/auth.json to authenticate.
# `:workspace` leaves a linked worktree's Git metadata read-only, so `task lane` adds four
# `--add-dir` grants (T-53): the worktree's own git dir, and the shared `objects`, `refs` and
# `logs`. That is enough to commit and merge on the task branch. `hooks`, `config` and `info`
# stay read-only: a writable hook or config would run outside the sandbox at the next Git command.
# The worktree's git dir is always `<common>/worktrees/<name>`, never `<common>`. Files in it that
# Git follows to config or hooks (`commondir`, `gitdir`, `config.worktree`, and the worktree's
# `.git`) are checked against `task`'s own records after every lane and before check, review and
# merge; `task lane` refuses when `extensions.worktreeConfig` is on. Reviews get no grants.
default_permissions = "lane"

[allowed_permission_profiles]
lane = true
review = true

# Hooks run even if a user config turns the hooks feature off.
[features]
hooks = true

# Managed hooks are trusted by policy and cannot be disabled from /hooks. The scripts are the
# root-owned published revision; each runs with a fixed PATH and an isolated root interpreter.
[hooks]
managed_dir = "/usr/local/lib/agent-policy"

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/usr/bin/env -u LD_PRELOAD -u LD_LIBRARY_PATH PATH=/usr/local/bin:/usr/bin:/bin /usr/bin/python3 -I /usr/local/lib/agent-policy/pre_tool_use.py --vendor codex"
timeout = 30

[[hooks.PreToolUse]]
matcher = "^(apply_patch|Edit|Write)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/usr/bin/env -u LD_PRELOAD -u LD_LIBRARY_PATH PATH=/usr/local/bin:/usr/bin:/bin /usr/bin/python3 -I /usr/local/lib/agent-policy/pre_tool_use.py --vendor codex"
timeout = 30

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "/usr/bin/env -u LD_PRELOAD -u LD_LIBRARY_PATH PATH=/usr/local/bin:/usr/bin:/bin /usr/bin/python3 -I /usr/local/lib/agent-policy/context_reminder.py"
timeout = 10

[[hooks.PermissionRequest]]
matcher = "^Bash$"

[[hooks.PermissionRequest.hooks]]
type = "command"
command = "/usr/bin/env -u LD_PRELOAD -u LD_LIBRARY_PATH PATH=/usr/local/bin:/usr/bin:/bin /usr/bin/python3 -I /usr/local/lib/agent-policy/pre_tool_use.py --vendor codex"
timeout = 30

# Requirements rules merge with ~/.codex/rules/*.rules and the most restrictive decision wins,
# so the user-level allow rules for routine Git/gh cannot lift these. Shared PreToolUse enforces
# workspace, secrets and forbidden operations at all argv positions; literal prefixes cannot
# cover global selectors or flags after arbitrary operands.
[rules]
prefix_rules = [
  { pattern = [{ any_of = ["git", "/usr/bin/git"] }, { any_of = ["reset", "rebase", "cherry-pick", "revert"] }], decision = "prompt", justification = "Approve this destructive local history/index operation." },
  { pattern = [{ any_of = ["git", "/usr/bin/git"] }, { token = "stash" }, { any_of = ["pop", "drop", "clear"] }], decision = "prompt", justification = "Approve this destructive stash operation." },
  { pattern = [{ any_of = ["git", "/usr/bin/git"] }, { token = "push" }, { any_of = ["--force", "--force-with-lease", "--force-if-includes", "-f", "--delete", "-d", "--mirror", "--prune"] }], decision = "forbidden", justification = "Force pushes and remote branch deletion are forbidden; use an ordinary task-branch push." },
  { pattern = [{ any_of = ["gh", "/usr/bin/gh"] }, { token = "pr" }, { token = "merge" }], decision = "forbidden", justification = "Merge, repository administration, deletion, secrets and rulesets are forbidden to this build lane." },
  { pattern = [{ any_of = ["gh", "/usr/bin/gh"] }, { token = "repo" }, { any_of = ["delete", "edit"] }], decision = "forbidden", justification = "Merge, repository administration, deletion, secrets and rulesets are forbidden to this build lane." },
  { pattern = [{ any_of = ["gh", "/usr/bin/gh"] }, { token = "release" }, { token = "delete" }], decision = "forbidden", justification = "Merge, repository administration, deletion, secrets and rulesets are forbidden to this build lane." },
  { pattern = [{ any_of = ["gh", "/usr/bin/gh"] }, { any_of = ["secret", "ruleset"] }], decision = "forbidden", justification = "Merge, repository administration, deletion, secrets and rulesets are forbidden to this build lane." },
  { pattern = [{ any_of = ["gh", "/usr/bin/gh"] }, { token = "api" }, { any_of = ["-X", "--method"] }, { token = "DELETE" }], decision = "forbidden", justification = "GitHub API DELETE is forbidden; use read-only requests." },
]

[permissions.lane]
extends = ":workspace"

# Managed profiles cannot be redefined in user config. Keep the network policy here;
# config.toml's features.network_proxy activates the proxy that enforces these hosts.
[permissions.lane.network]
enabled = true
enable_socks5 = false
allow_local_binding = true

[permissions.lane.network.domains]
"pypi.org" = "allow"
"files.pythonhosted.org" = "allow"
"registry.npmjs.org" = "allow"
"github.com" = "allow"
"objects.githubusercontent.com" = "allow"
"codeload.github.com" = "allow"
"raw.githubusercontent.com" = "allow"
"release-assets.githubusercontent.com" = "allow"
"openrouter.ai" = "allow"

[permissions.lane.filesystem]
"~/.ssh" = "deny"
"~/.aws" = "deny"
"~/.azure" = "deny"
"~/.kube" = "deny"
"~/.gnupg" = "deny"
"~/.config/gh" = "deny"
"~/.config/gcloud" = "deny"
"~/.docker/config.json" = "deny"
"~/.netrc" = "deny"
"~/.npmrc" = "deny"
"~/.claude.json" = "deny"
"~/.claude/.credentials.json" = "deny"
"~/.codex/auth.json" = "deny"
"~/.gemini" = "deny"
"~/project-data" = "deny"
"~/dev_workspace/typo3-dkm" = "deny"
"~/dev_workspace/typo3-dkm-plugin" = "deny"
"~/dev_workspace/customer-harness" = "deny"
"~/dev_workspace/photo-organizer" = "deny"
"~/cortex/cortex-kb-typo3-dkm" = "deny"
"~/cortex/cortex-kb-customer-harness" = "deny"
"~/cortex/cortex-kb-photo-organizer" = "deny"

[permissions.review]
extends = ":read-only"

[permissions.review.filesystem]
"~/.ssh" = "deny"
"~/.aws" = "deny"
"~/.azure" = "deny"
"~/.kube" = "deny"
"~/.gnupg" = "deny"
"~/.config/gh" = "deny"
"~/.config/gcloud" = "deny"
"~/.docker/config.json" = "deny"
"~/.netrc" = "deny"
"~/.npmrc" = "deny"
"~/.claude.json" = "deny"
"~/.claude/.credentials.json" = "deny"
"~/.codex/auth.json" = "deny"
"~/.gemini" = "deny"
"~/project-data" = "deny"
"~/dev_workspace/typo3-dkm" = "deny"
"~/dev_workspace/typo3-dkm-plugin" = "deny"
"~/dev_workspace/customer-harness" = "deny"
"~/dev_workspace/photo-organizer" = "deny"
"~/cortex/cortex-kb-typo3-dkm" = "deny"
