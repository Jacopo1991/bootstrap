approval_policy = "on-request"
approvals_reviewer = "user"

# Managed permission profiles select filesystem and network access. Legacy sandbox
# settings are ignored; feature-level proxy policy is replaced by profile policy.
# Activate the proxy here; lane hosts, SOCKS and loopback policy live in
# /etc/codex/requirements.toml. The review profile has no network access.
[features]
network_proxy = true
