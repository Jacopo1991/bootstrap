approval_policy = "on-request"
approvals_reviewer = "user"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
# Tool caches needed by sandboxed project checks. Keep these roots limited to caches.
writable_roots = ["~/.cache/uv", "~/.cache/pre-commit", "~/.cache/pip", "~/.npm"]
# Network on inside the sandbox, but only through Codex's own proxy (below), which allows the
# exact host openrouter.ai for paid probes: tests can also bind and reach 127.0.0.1.
# git and gh network commands keep running outside the sandbox (policy hook).
network_access = true

# The hooks feature and the policy hooks are pinned in /etc/codex/requirements.toml.
[features.network_proxy]
enabled = true
allow_local_binding = true
domains = { "openrouter.ai" = "allow" }
# Keep the HTTP proxy and its domain policy, but do not expose a SOCKS proxy to commands.
enable_socks5 = false
