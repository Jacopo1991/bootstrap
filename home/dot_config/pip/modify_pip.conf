#!/usr/bin/python3
"""Keep package caps in their own pip keys; preserve unrelated settings."""
import configparser
import sys

config = configparser.ConfigParser(interpolation=None)
config.read_string(sys.stdin.read())
if not config.has_section('install'):
    config.add_section('install')
for key in ('constraint', 'build-constraint'):
    config.set('install', key, '/usr/local/lib/agent-policy/constraints.txt')
config.write(sys.stdout)
